name: Build CI

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  push:
    branches: [ main ]
    paths-ignore:
      - .github/workflows/codespell.yml
      - .github/workflows/markdown-link.yml
      - .github/workflows/shellcheck.yml
      - docs/**
      - LICENSE
      - README.md

  pull_request:
    branches: [ main ]
    paths-ignore:
      - .github/workflows/codespell.yml
      - .github/workflows/markdown-link.yml
      - .github/workflows/shellcheck.yml
      - docs/**
      - LICENSE
      - README.md

jobs:
  ubuntu_22_04:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - cc:  gcc-12
            cxx: g++-12
          - cc:  gcc-11
            cxx: g++-11
          # gcc-10 dropped here (still tested on the ubuntu-20.04 job below):
          # the ubuntu-22.04 runner's current kernel headers bake in
          # -fzero-call-used-regs=... (CONFIG_ZERO_CALL_USED_REGS), which
          # requires GCC 11+; gcc-10 hard-fails with "unrecognized
          # command-line option" building any object file. Verified this
          # isn't fixable from the module's own Makefile: KBUILD_CFLAGS can
          # be filtered for the main M= build, but the module.mod.o/
          # module-common.o final-link stage (scripts/Makefile.modfinal) is
          # a separate kbuild sub-invocation that re-derives its own
          # KBUILD_CFLAGS from kernel config, unaffected by that override.

    name: Ubuntu 22.04 ${{ matrix.compiler.cc }}

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ${{ matrix.compiler.cc }} ${{ matrix.compiler.cxx }} build-essential dkms git iw
      - name: Build with ${{ matrix.compiler.cc }}
        run: |
          CPUS=$(nproc)
          echo "::group::make clean"
          make clean
          echo "::endgroup::"
          echo "::group::build"
          make -j ${CPUS} CC=${{ matrix.compiler.cc }} CXX=${{ matrix.compiler.cxx }}
          echo "::endgroup::"

  # ubuntu_20_04 job removed: the ubuntu-20.04 GitHub-hosted runner image was
  # fully retired by GitHub on 2025-04-15 (actions/runner-images#11101,
  # https://github.blog/changelog/2025-01-15-github-actions-ubuntu-20-runner-image-brownout-dates-and-other-breaking-changes/).
  # Jobs requesting it never get a runner assigned (runner_id stays 0) and
  # sit in "queued" forever instead of failing outright -- verified this on
  # both this repo's own recent Build CI runs and a manual workflow_dispatch
  # on a fork, so it isn't a transient queue backlog. The gcc-9/10/11 vs.
  # gcc-11/12 coverage this job used to provide was never actually running.
